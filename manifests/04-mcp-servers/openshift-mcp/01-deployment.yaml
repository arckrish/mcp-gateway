# openshift-mcp-server: a Kubernetes/OpenShift MCP server that exposes
# cluster-management tools (core, config, helm toolsets) to MCP clients.
#
# Source: https://github.com/containers/kubernetes-mcp-server
# Sample reference: https://github.com/ravisharma5/rhoai-llamastack
#
# This file deploys:
#   - ServiceAccount with cluster-wide 'view' permissions (read-only by default)
#   - Deployment running the kubernetes_mcp_server image
#   - Service exposing port 8080
#
# The server starts with --disable-destructive so write-style tools are gated.
# Adjust --toolsets and the ClusterRoleBinding role as your use case requires.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openshift-mcp-server
  namespace: demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openshift-mcp-server-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: openshift-mcp-server
    namespace: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openshift-mcp-server
  namespace: demo
  labels:
    app: openshift-mcp-server
    app.kubernetes.io/component: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openshift-mcp-server
  template:
    metadata:
      labels:
        app: openshift-mcp-server
        app.kubernetes.io/component: mcp-server
    spec:
      serviceAccountName: openshift-mcp-server
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-server
          image: quay.io/containers/kubernetes_mcp_server:latest
          args:
            - "--port"
            - "8080"
            - "--disable-destructive"
            - "--toolsets"
            - "core,config,helm"
            - "--stateless"
            - "--cluster-provider"
            - "in-cluster"
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: openshift-mcp-server
  namespace: demo
  labels:
    app: openshift-mcp-server
spec:
  selector:
    app: openshift-mcp-server
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP
