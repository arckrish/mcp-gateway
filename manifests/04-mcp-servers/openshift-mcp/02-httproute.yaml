# This HTTPRoute exists primarily to give the MCPServerRegistration a target
# that points at the backend Service. The broker uses it to discover where
# to send tool calls.
#
# The path /backends/openshift-mcp is deliberately chosen to NOT conflict with
# the auto-created mcp-gateway-route (which claims /mcp on the same hostname).
#
# REPLACE __MCP_HOSTNAME__ before applying (install.sh does this automatically).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openshift-mcp-server
  namespace: demo
  labels:
    app: openshift-mcp-server
spec:
  hostnames:
    - __MCP_HOSTNAME__
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: mcp-gateway
      namespace: openshift-ingress
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /backends/openshift-mcp
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            add:
              - name: Access-Control-Allow-Origin
                value: "*"
              - name: Access-Control-Allow-Methods
                value: "GET, POST, PUT, DELETE, OPTIONS, HEAD"
              - name: Access-Control-Allow-Headers
                value: "Content-Type, Authorization, Accept, Origin, X-Requested-With"
              - name: Access-Control-Max-Age
                value: "3600"
              - name: Access-Control-Allow-Credentials
                value: "true"
      backendRefs:
        - group: ""
          kind: Service
          name: openshift-mcp-server
          port: 8080
          weight: 1
